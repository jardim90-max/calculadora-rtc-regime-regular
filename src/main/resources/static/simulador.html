<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador CBS IBS IS</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#1c2230;--muted:#5d6678;--line:#dde1e8;--soft:#eef1f5;
  --accent:#1f5fbf;--accent-ink:#fff;--ok:#18794e;--ok-bg:#e3f4ea;--warn:#8a5a00;--warn-bg:#fdf1d8;
  --err:#b42318;--err-bg:#fde8e7;--cbs:#1f5fbf;--ibs:#0f7b6c;--is:#8b3fb8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151b;--card:#1b2029;--ink:#e6e9ef;--muted:#9aa3b5;--line:#2c3340;--soft:#232a35;
  --accent:#5b93f0;--accent-ink:#0b1220;--ok:#5fd09a;--ok-bg:#16301f;--warn:#f0bf5a;--warn-bg:#3a2d10;
  --err:#ff8a80;--err-bg:#3d1a18;--cbs:#7aa8f5;--ibs:#4fc9b6;--is:#c38be6;}}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px}
header .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:19px;margin:0}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
h2{font-size:16px;margin:0 0 12px}
.wrap{max-width:1180px;margin:0 auto}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
input,select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hint{font-size:12px;color:var(--muted);margin-top:3px;min-height:16px}
.hint.bad{color:var(--err)}
button{font:inherit;font-size:14px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;cursor:pointer}
button:hover{background:var(--soft)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover{filter:brightness(1.07)}
button.link{border:none;background:none;color:var(--accent);padding:4px 6px}
button.danger{color:var(--err)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.item{border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:12px;background:var(--soft)}
.item-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.item-head strong{font-size:14.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:6px 12px;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.is-box{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:500;cursor:pointer}
.check input{width:auto}
.notice{padding:10px 12px;border-radius:8px;font-size:13.5px;margin-bottom:12px}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.err{background:var(--err-bg);color:var(--err)}
.notice.info{background:var(--soft);color:var(--muted)}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin-bottom:16px}
.tile{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--card)}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.tile.cbs{border-left:4px solid var(--cbs)}.tile.ibs{border-left:4px solid var(--ibs)}.tile.is{border-left:4px solid var(--is)}
.tile.total{border-left:4px solid var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600}
.tbl{overflow-x:auto}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.sim{background:var(--warn-bg);color:var(--warn)}
.badge.err{background:var(--err-bg);color:var(--err)}
.res-item{border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:12px}
.res-item h3{font-size:15px;margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.res-item .sub{color:var(--muted);font-size:13px;margin:2px 0 10px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--accent);font-size:13.5px}
.memo{font-size:13px;color:var(--muted);margin:6px 0 0;padding-left:16px}
.memo li{margin-bottom:4px}
pre{background:var(--soft);padding:10px;border-radius:8px;overflow:auto;font-size:12px;max-height:360px}
.muted{color:var(--muted)}
.loading{opacity:.55;pointer-events:none}
@media (max-width:600px){.grid{grid-template-columns:1fr 1fr}.tile .v{font-size:18px}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Simulador CBS / IBS / Imposto Seletivo<small>Reforma Tributária do Consumo (LC 214/2025), regime regular. Usa a calculadora oficial rodando neste computador.</small></h1>
  <div class="row">
    <button class="link" id="btnExemplo" type="button">Carregar exemplo</button>
    <button class="link" id="btnLimpar" type="button">Limpar</button>
    <a href="swagger-ui/index.html" target="_blank" class="link" style="color:var(--accent);font-size:14px">Swagger (avançado)</a>
  </div>
</div></header>

<main class="wrap">
  <div id="msgApi"></div>

  <section class="card">
    <h2>1. Dados da operação</h2>
    <div class="grid">
      <div><label for="data">Data do fato gerador</label><input type="date" id="data"></div>
      <div><label for="uf">UF</label><select id="uf"><option>Carregando…</option></select></div>
      <div style="grid-column:span 2"><label for="mun">Município</label><select id="mun"><option value="">Escolha a UF</option></select></div>
    </div>
    <div id="aliqBox" style="margin-top:14px">
      <div class="notice info" id="aliqInfo"></div>
      <div class="grid" id="aliqCampos">
        <div><label for="aCbs">Alíquota CBS (%)</label><input type="number" step="0.0001" id="aCbs" value="8.8"></div>
        <div><label for="aIbsUf">Alíquota IBS estadual (%)</label><input type="number" step="0.0001" id="aIbsUf" value="0.05"></div>
        <div><label for="aIbsMun">Alíquota IBS municipal (%)</label><input type="number" step="0.0001" id="aIbsMun" value="0.05"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="row" style="margin-bottom:12px"><h2 style="margin:0">2. Itens</h2><span class="spacer"></span><button type="button" id="btnAdd">+ Adicionar item</button></div>
    <div id="itens"></div>
    <div class="row" style="margin-top:6px">
      <button class="primary" type="button" id="btnCalcular">Calcular tributos</button>
      <span class="muted" id="status"></span>
    </div>
  </section>

  <section class="card" id="resultado" hidden>
    <div class="row" style="margin-bottom:12px"><h2 style="margin:0">3. Resultado</h2><span class="spacer"></span>
      <button type="button" id="btnXml">Baixar XML (NF-e)</button>
      <button type="button" id="btnJson">Baixar JSON do resultado</button>
    </div>
    <div id="resAviso"></div>
    <div class="tiles" id="tiles"></div>
    <div class="tbl" id="tabela"></div>
    <h2 style="margin-top:18px">Detalhe por item</h2>
    <div id="detalhes"></div>
    <details><summary>Ver dados técnicos (JSON enviado e recebido)</summary><pre id="jsonTec"></pre></details>
  </section>
</main>

<template id="tplItem">
  <div class="item">
    <div class="item-head">
      <strong class="titulo">Item 1</strong>
      <div class="seg"><button type="button" data-tipo="ncm" class="on">Mercadoria (NCM)</button><button type="button" data-tipo="nbs">Serviço (NBS)</button></div>
      <span class="spacer"></span>
      <button type="button" class="link danger rm">Remover</button>
    </div>
    <div class="grid">
      <div><label class="lblCod">NCM</label><input class="cod" inputmode="numeric" placeholder="ex.: 10063021"><div class="hint codHint"></div></div>
      <div style="grid-column:span 2"><label>CST (situação tributária)</label><select class="cst"></select></div>
      <div style="grid-column:span 2"><label>cClassTrib (classificação tributária)</label><select class="ccl"></select><div class="hint cclHint"></div></div>
      <div><label>Base de cálculo (R$)</label><input class="base" type="number" step="0.01" min="0" placeholder="0,00"><div class="hint baseHint"></div></div>
      <div><label>Quantidade</label><input class="qtd" type="number" step="0.0001" min="0"></div>
      <div><label>Unidade</label><input class="un" placeholder="UN, KG, LT…"></div>
    </div>
    <div class="is-box">
      <label class="check"><input type="checkbox" class="temIs"> Item sujeito ao Imposto Seletivo (IS)</label>
      <div class="grid isCampos" hidden style="margin-top:10px">
        <div style="grid-column:span 2"><label>CST do IS</label><select class="isCst"></select></div>
        <div style="grid-column:span 2"><label>cClassTrib do IS</label><select class="isCcl"></select></div>
        <div><label>Base de cálculo do IS (R$)</label><input class="isBase" type="number" step="0.01" min="0"></div>
        <div class="isAliqWrap"><label>Alíquota IS ad valorem (%)</label><input class="isAliq" type="number" step="0.0001" min="0"></div>
        <div class="isAliqWrap"><label>Alíquota IS ad rem (R$/un.)</label><input class="isAdRem" type="number" step="0.0001" min="0"></div>
        <div><label>IS informado (R$, opcional)</label><input class="isInf" type="number" step="0.01" min="0"></div>
      </div>
    </div>
  </div>
</template>

<script>
const API = 'calculadora';
const $ = s => document.querySelector(s);
const fmt = v => (v === undefined || v === null || v === '') ? '—' : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPct = v => (v === undefined || v === null || v === '') ? '—' : Number(v).toLocaleString('pt-BR',{maximumFractionDigits:4}) + '%';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => v === '' || v === null || v === undefined ? undefined : Number(v);

let cstLista = [], cclDetalhe = {}, isCstLista = [], isCclCache = {};
let ultimaEntrada = null, ultimaResposta = null;

async function get(path){
  const r = await fetch(`${API}/${path}`);
  if (!r.ok) throw Object.assign(new Error('HTTP '+r.status), {status:r.status, body: await r.text().catch(()=>'')});
  return r.json();
}
function dataISO(){ return $('#data').value || new Date().toISOString().slice(0,10); }
function ano(){ return Number(dataISO().slice(0,4)); }

/* ---------- carga de tabelas ---------- */
async function carregarUfs(){
  const ufs = await get('dados-abertos/ufs');
  ufs.sort((a,b)=>a.sigla.localeCompare(b.sigla));
  $('#uf').innerHTML = ufs.map(u=>`<option value="${u.sigla}">${u.sigla} – ${esc(u.nome)}</option>`).join('');
}
async function carregarMunicipios(sel){
  const uf = $('#uf').value; if(!uf) return;
  $('#mun').innerHTML = '<option>Carregando…</option>';
  const ms = await get('dados-abertos/ufs/municipios?siglaUf='+uf);
  $('#mun').innerHTML = ms.map(m=>`<option value="${m.codigo}">${esc(m.nome)} (${m.codigo})</option>`).join('');
  if (sel) $('#mun').value = sel;
}
async function carregarClassificacoes(){
  const d = dataISO();
  try{
    const [csts, det, isCsts] = await Promise.all([
      get('dados-abertos/situacoes-tributarias/cbs-ibs?data='+d),
      get('dados-abertos/classificacoes-tributarias/cbs-ibs?data='+d),
      get('dados-abertos/situacoes-tributarias/imposto-seletivo?data='+d).catch(()=>[])
    ]);
    cstLista = csts; cclDetalhe = {}; det.forEach(c=>cclDetalhe[c.codigo]=c);
    isCstLista = isCsts; isCclCache = {};
    document.querySelectorAll('#itens .item').forEach(el=>preencherCst(el));
    $('#msgApi').innerHTML='';
  }catch(e){
    $('#msgApi').innerHTML = `<div class="notice err">Não consegui ler as tabelas da calculadora (${esc(e.message)}). Verifique se a janela do INICIAR.bat está aberta.</div>`;
  }
}

/* ---------- itens ---------- */
function preencherCst(el){
  const cst = el.querySelector('.cst'), atual = cst.value || el.dataset.cst || '000';
  cst.innerHTML = cstLista.map(c=>`<option value="${c.codigo}">${c.codigo} – ${esc(c.descricao)}</option>`).join('');
  cst.value = cstLista.some(c=>c.codigo===atual) ? atual : (cstLista[0]?.codigo||'');
  preencherCcl(el);
  const isc = el.querySelector('.isCst'), isAtual = isc.value || el.dataset.isCst || '000';
  isc.innerHTML = isCstLista.map(c=>`<option value="${c.codigo}">${c.codigo} – ${esc(c.descricao)}</option>`).join('');
  isc.value = isCstLista.some(c=>c.codigo===isAtual) ? isAtual : (isCstLista[0]?.codigo||'');
  preencherIsCcl(el);
}
function preencherCcl(el){
  const cst = el.querySelector('.cst').value, sel = el.querySelector('.ccl');
  const atual = sel.value || el.dataset.ccl;
  const lista = (cstLista.find(c=>c.codigo===cst)?.classificacoesTributarias)||[];
  sel.innerHTML = lista.map(c=>`<option value="${c.codigo}">${c.codigo} – ${esc(c.descricao)}</option>`).join('');
  if (lista.some(c=>c.codigo===atual)) sel.value = atual;
  el.dataset.ccl = ''; mostrarCcl(el);
}
function mostrarCcl(el){
  const c = cclDetalhe[el.querySelector('.ccl').value];
  el.querySelector('.cclHint').textContent = c ? `${c.descricaoTratamentoTributario || ''}${c.nomenclatura ? ' · exige '+c.nomenclatura : ''}` : '';
}
async function preencherIsCcl(el){
  const cst = el.querySelector('.isCst').value, sel = el.querySelector('.isCcl');
  const atual = sel.value || el.dataset.isCcl;
  if (!cst){ sel.innerHTML=''; return; }
  if (!isCclCache[cst]) isCclCache[cst] = await get(`dados-abertos/classificacoes-tributarias/imposto-seletivo/${cst}?data=${dataISO()}`).catch(()=>[]);
  sel.innerHTML = isCclCache[cst].map(c=>`<option value="${c.codigo}">${c.codigo} – ${esc(c.descricao)}</option>`).join('');
  if (isCclCache[cst].some(c=>c.codigo===atual)) sel.value = atual;
  el.dataset.isCcl='';
}
function setTipo(el, tipo){
  el.dataset.tipo = tipo;
  el.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on', b.dataset.tipo===tipo));
  el.querySelector('.lblCod').textContent = tipo==='ncm' ? 'NCM' : 'NBS';
  el.querySelector('.cod').placeholder = tipo==='ncm' ? 'ex.: 10063021' : 'ex.: 122011200';
  consultarCodigo(el);
}
let tmrCod;
async function consultarCodigo(el){
  const cod = el.querySelector('.cod').value.replace(/\D/g,''), h = el.querySelector('.codHint');
  h.classList.remove('bad');
  if (!cod){ h.textContent=''; return; }
  try{
    const r = await get(`dados-abertos/${el.dataset.tipo}?${el.dataset.tipo}=${cod}&data=${dataISO()}`);
    h.textContent = [r.capitulo, r.posicao, r.subitem, r.item].filter(Boolean).pop() || 'Código encontrado';
    if (r.tributadoPeloImpostoSeletivo) h.textContent += ' · sujeito ao IS';
  }catch(e){ h.textContent = 'Código não encontrado na tabela'; h.classList.add('bad'); }
}
function numerar(){ document.querySelectorAll('#itens .item').forEach((el,i)=>el.querySelector('.titulo').textContent='Item '+(i+1)); }
function addItem(v={}){
  const el = $('#tplItem').content.firstElementChild.cloneNode(true);
  el.dataset.tipo = v.nbs ? 'nbs' : 'ncm';
  el.dataset.cst = v.cst||''; el.dataset.ccl = v.cClassTrib||'';
  el.querySelector('.cod').value = v.ncm || v.nbs || '';
  el.querySelector('.base').value = v.baseCalculo ?? '';
  el.querySelector('.qtd').value = v.quantidade ?? '';
  el.querySelector('.un').value = v.unidade ?? '';
  if (v.is){
    el.querySelector('.temIs').checked = true; el.querySelector('.isCampos').hidden = false;
    el.dataset.isCst = v.is.cst; el.dataset.isCcl = v.is.cClassTrib;
    el.querySelector('.isBase').value = v.is.baseCalculo ?? '';
    el.querySelector('.isAliq').value = v.is.adValorem ?? '';
    el.querySelector('.isAdRem').value = v.is.adRem ?? '';
    el.querySelector('.isInf').value = v.is.impostoInformado ?? '';
  }
  el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setTipo(el,b.dataset.tipo));
  el.querySelector('.rm').onclick=()=>{ el.remove(); numerar(); salvar(); };
  el.querySelector('.cst').onchange=()=>{ preencherCcl(el); salvar(); };
  el.querySelector('.ccl').onchange=()=>{ mostrarCcl(el); salvar(); };
  el.querySelector('.isCst').onchange=()=>{ preencherIsCcl(el); salvar(); };
  el.querySelector('.temIs').onchange=e=>{ el.querySelector('.isCampos').hidden=!e.target.checked; atualizarBaseHint(el); salvar(); };
  el.querySelector('.cod').oninput=()=>{ clearTimeout(tmrCod); tmrCod=setTimeout(()=>consultarCodigo(el),400); };
  el.addEventListener('input', ()=>{ atualizarBaseHint(el); salvar(); });
  $('#itens').appendChild(el);
  setTipo(el, el.dataset.tipo); preencherCst(el); atualizarBaseHint(el); numerar(); atualizarAliqUI();
}
function atualizarBaseHint(el){
  const temIs = el.querySelector('.temIs').checked;
  el.querySelector('.baseHint').textContent = temIs ? 'Pode deixar em branco: a calculadora usa base do IS + IS' : '';
}

/* ---------- alíquotas por ano ---------- */
function atualizarAliqUI(){
  const a = ano(), exige = a >= 2027;
  $('#aliqCampos').hidden = !exige;
  document.querySelectorAll('.isAliqWrap').forEach(w=>w.hidden=!exige);
  $('#aliqInfo').innerHTML = exige
    ? `Para ${a} a lei ainda não fixou as alíquotas definitivas, então a calculadora exige que você informe as alíquotas nominais. O resultado sai como <b>simulado</b>.`
    : `Em ${a} a calculadora usa as alíquotas de teste oficiais (CBS 0,9% e IBS 0,1%). Não é preciso informar alíquotas.`;
}

/* ---------- montar entrada ---------- */
function montarEntrada(){
  const exige = ano() >= 2027;
  const aliq = exige ? { cbs:num($('#aCbs').value), ibsEstadual:num($('#aIbsUf').value), ibsMunicipal:num($('#aIbsMun').value) } : undefined;
  const itens = [...document.querySelectorAll('#itens .item')].map((el,i)=>{
    const q = s => el.querySelector(s).value.trim();
    const it = { numero:i+1, cst:q('.cst'), cClassTrib:q('.ccl') };
    const cod = q('.cod').replace(/\D/g,''); if (cod) it[el.dataset.tipo] = cod;
    if (q('.base')!=='') it.baseCalculo = num(q('.base'));
    if (q('.qtd')!=='') it.quantidade = num(q('.qtd'));
    if (q('.un')) it.unidade = q('.un').toUpperCase();
    let aliqItem = aliq ? {...aliq} : undefined;
    if (el.querySelector('.temIs').checked){
      it.impostoSeletivo = { cst:q('.isCst'), cClassTrib:q('.isCcl'), baseCalculo:num(q('.isBase')) };
      if (it.quantidade !== undefined) it.impostoSeletivo.quantidade = it.quantidade;
      if (it.unidade) it.impostoSeletivo.unidade = it.unidade;
      if (q('.isInf')!=='') it.impostoSeletivo.impostoInformado = num(q('.isInf'));
      if (exige){
        const s = {}; if (q('.isAliq')!=='') s.adValorem=num(q('.isAliq')); if (q('.isAdRem')!=='') s.adRem=num(q('.isAdRem'));
        if (Object.keys(s).length) aliqItem.impostoSeletivo = s;
      }
    }
    if (aliqItem) it.aliquotasNominais = aliqItem;
    return it;
  });
  return {
    id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())).replace(/-/g,''),
    versao:'1.0.0',
    dhFatoGerador: dataISO()+'T12:00:00-03:00',
    municipio: Number($('#mun').value), uf: $('#uf').value, itens
  };
}

/* ---------- calcular ---------- */
async function calcular(){
  const entrada = montarEntrada();
  if (!entrada.itens.length){ $('#status').textContent='Adicione pelo menos um item.'; return; }
  $('#status').textContent='Calculando…'; document.body.classList.add('loading');
  try{
    const r = await fetch(`${API}/observabilidade/regime-geral`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(entrada)});
    const txt = await r.text(); let corpo; try{ corpo = JSON.parse(txt);}catch{ corpo = {detail:txt}; }
    ultimaEntrada = entrada; ultimaResposta = r.ok ? corpo : null;
    mostrarResultado(entrada, corpo, r.ok, r.headers.get('x-warning-dados-simulados'));
    $('#status').textContent = '';
  }catch(e){
    $('#status').textContent = 'Falha ao chamar a calculadora: '+e.message;
  }finally{ document.body.classList.remove('loading'); }
}

const ESTADOS = {
  CALCULADO:['ok','Calculado'], CALCULO_SIMULADO:['sim','Calculado (simulado)'],
  INCONSISTENCIA_ENTRADA:['err','Erro nos dados'], NAO_IMPLEMENTADO:['err','Não implementado'], FALHA_TECNICA:['err','Falha técnica']
};
function badge(estado){ const [c,t] = ESTADOS[estado]||['sim',estado||'—']; return `<span class="badge ${c}">${esc(t)}</span>`; }

function mostrarResultado(entrada, res, ok, avisoSim){
  $('#resultado').hidden = false;
  $('#jsonTec').textContent = 'ENVIADO:\n'+JSON.stringify(entrada,null,2)+'\n\nRECEBIDO:\n'+JSON.stringify(res,null,2);
  const av = $('#resAviso'); av.innerHTML='';
  if (!ok){
    const erros = res.erros || res.errors || [];
    av.innerHTML = `<div class="notice err"><b>${esc(res.title||'Erro')}</b>: ${esc(res.detail||'')}${erros.map(e=>'<br>• '+esc(e.detail||e.message||JSON.stringify(e))).join('')}</div>`;
    $('#tiles').innerHTML=''; $('#tabela').innerHTML=''; $('#detalhes').innerHTML='';
    $('#btnXml').disabled = $('#btnJson').disabled = true;
    $('#resultado').scrollIntoView({behavior:'smooth'}); return;
  }
  $('#btnJson').disabled = false;
  const objs = res.objetos||[];
  const algumErro = objs.some(o=>o.erros?.length);
  $('#btnXml').disabled = algumErro;
  if (objs.some(o=>o.estadoItem==='CALCULO_SIMULADO'))
    av.innerHTML += `<div class="notice warn">Cálculo <b>simulado</b>: foi feito com as alíquotas que você informou, e não com alíquotas oficiais.</div>`;
  if (algumErro) av.innerHTML += `<div class="notice err">Alguns itens têm erro e ficaram de fora dos totais. Veja o detalhe abaixo.</div>`;

  const t = res.total?.tribCalc||{}, ib = t.IBSCBSTot||{};
  const vCBS = +(ib.gCBS?.vCBS||0), vIBS = +(ib.gIBS?.vIBS||0), vIS = +(t.ISTot?.vIS||0), vBC = +(ib.vBCIBSCBS||0);
  const total = vCBS+vIBS+vIS;
  $('#tiles').innerHTML = `
    <div class="tile"><div class="k">Base de cálculo CBS/IBS</div><div class="v">R$ ${fmt(vBC)}</div></div>
    <div class="tile cbs"><div class="k">CBS (federal)</div><div class="v">R$ ${fmt(vCBS)}</div></div>
    <div class="tile ibs"><div class="k">IBS (UF R$ ${fmt(ib.gIBS?.gIBSUF?.vIBSUF)} + Mun. R$ ${fmt(ib.gIBS?.gIBSMun?.vIBSMun)})</div><div class="v">R$ ${fmt(vIBS)}</div></div>
    <div class="tile is"><div class="k">Imposto Seletivo</div><div class="v">R$ ${fmt(vIS)}</div></div>
    <div class="tile total"><div class="k">Total de tributos${vBC? ' · '+fmtPct((total/vBC*100).toFixed(2))+' da base':''}</div><div class="v">R$ ${fmt(total)}</div></div>`;

  const linhas = objs.map(o=>{
    const it = entrada.itens[o.nObj-1]||{}, g = o.tribCalc?.IBSCBS?.gIBSCBS, is = o.tribCalc?.IS;
    return `<tr><td>${o.nObj}. ${esc(it.ncm||it.nbs||'')} <span class="muted">${esc(it.cClassTrib||'')}</span></td><td>${badge(o.estadoItem)}</td>
      <td>${fmt(g?.vBC)}</td><td>${fmt(g?.gCBS?.vCBS)}</td><td>${fmt(g?.gIBSUF?.vIBSUF)}</td><td>${fmt(g?.gIBSMun?.vIBSMun)}</td><td>${fmt(is?.vIS)}</td></tr>`;
  }).join('');
  $('#tabela').innerHTML = `<table><thead><tr><th>Item</th><th>Situação</th><th>Base (R$)</th><th>CBS</th><th>IBS UF</th><th>IBS Mun.</th><th>IS</th></tr></thead><tbody>${linhas}</tbody></table>`;

  $('#detalhes').innerHTML = objs.map(o=>{
    const it = entrada.itens[o.nObj-1]||{}, ibs = o.tribCalc?.IBSCBS, g = ibs?.gIBSCBS, is = o.tribCalc?.IS;
    const cd = cclDetalhe[it.cClassTrib];
    let h = `<div class="res-item"><h3>Item ${o.nObj} ${badge(o.estadoItem)}</h3>
      <div class="sub">${it.ncm?'NCM '+esc(it.ncm):it.nbs?'NBS '+esc(it.nbs):''} · CST ${esc(it.cst)} · cClassTrib ${esc(it.cClassTrib)}${cd?' – '+esc(cd.descricao):''}</div>`;
    if (o.erros?.length) h += o.erros.map(e=>`<div class="notice err"><b>${esc(e.code)} · ${esc(e.title)}</b><br>${esc(e.detail)}</div>`).join('');
    const memos = [];
    if (g){
      const lin = (nome, aliq, red, val, memo)=>{ if(memo) memos.push(`<li><b>${nome}:</b> ${esc(memo)}</li>`);
        return `<tr><td>${nome}</td><td>${fmtPct(aliq)}</td><td>${red?fmtPct(red.pRedAliq):'—'}</td><td>${fmtPct(red?red.pAliqEfet:aliq)}</td><td>${fmt(val)}</td></tr>`; };
      h += `<div class="tbl"><table><thead><tr><th>Tributo (base R$ ${fmt(g.vBC)})</th><th>Alíquota</th><th>Redução</th><th>Alíq. efetiva</th><th>Valor (R$)</th></tr></thead><tbody>
        ${lin('CBS', g.gCBS?.pCBS, g.gCBS?.gRed, g.gCBS?.vCBS, g.gCBS?.memoriaCalculo)}
        ${lin('IBS estadual', g.gIBSUF?.pIBSUF, g.gIBSUF?.gRed, g.gIBSUF?.vIBSUF, g.gIBSUF?.memoriaCalculo)}
        ${lin('IBS municipal', g.gIBSMun?.pIBSMun, g.gIBSMun?.gRed, g.gIBSMun?.vIBSMun, g.gIBSMun?.memoriaCalculo)}
        ${is ? `<tr><td>Imposto Seletivo (base R$ ${fmt(is.vBCIS)})</td><td>${fmtPct(is.pIS)}</td><td>—</td><td>${fmtPct(is.pIS)}</td><td>${fmt(is.vIS)}</td></tr>`:''}
      </tbody></table></div>`;
      if (is?.memoriaCalculo) memos.push(`<li><b>IS:</b> ${esc(is.memoriaCalculo)}</li>`);
    } else if (ibs && !o.erros?.length){
      h += `<div class="muted">Sem destaque de CBS/IBS para esta classificação.</div>`;
    }
    if (memos.length) h += `<details><summary>Memória de cálculo</summary><ul class="memo">${memos.join('')}</ul></details>`;
    return h + '</div>';
  }).join('');
  $('#resultado').scrollIntoView({behavior:'smooth'});
}

/* ---------- downloads ---------- */
function baixar(nome, conteudo, tipo){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([conteudo],{type:tipo})); a.download = nome; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
$('#btnJson').onclick = ()=> ultimaResposta && baixar('resultado-calculo.json', JSON.stringify(ultimaResposta,null,2), 'application/json');
$('#btnXml').onclick = async ()=>{
  if (!ultimaEntrada) return;
  try{
    const r = await fetch(`${API}/regime-geral`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(ultimaEntrada)});
    if (!r.ok) throw new Error('cálculo recusado ('+r.status+')');
    const x = await fetch(`${API}/xml/generate?tipo=nfe`, {method:'POST', headers:{'Content-Type':'application/json'}, body: await r.text()});
    if (!x.ok) throw new Error('geração do XML falhou ('+x.status+')');
    baixar('grupo-tributacao-nfe.xml', await x.text(), 'application/xml');
  }catch(e){ alert('Não foi possível gerar o XML: '+e.message); }
};

/* ---------- exemplo / persistência ---------- */
const EXEMPLO = {
  data:'2027-03-10', uf:'RS', mun:'4314902', aliq:[8.8,0.05,0.05],
  itens:[
    {ncm:'10063021', cst:'200', cClassTrib:'200003', baseCalculo:100, quantidade:20, unidade:'KG'},
    {ncm:'22030000', cst:'000', cClassTrib:'000001', quantidade:12, unidade:'LT', is:{cst:'000', cClassTrib:'000001', baseCalculo:150, adValorem:10, impostoInformado:15}},
    {nbs:'122011200', cst:'200', cClassTrib:'200028', baseCalculo:1200}
  ]
};
async function aplicar(cfg){
  $('#data').value = cfg.data; atualizarAliqUI();
  [$('#aCbs').value,$('#aIbsUf').value,$('#aIbsMun').value] = cfg.aliq || [8.8,0.05,0.05];
  $('#uf').value = cfg.uf; await carregarMunicipios(cfg.mun);
  await carregarClassificacoes();
  $('#itens').innerHTML=''; (cfg.itens.length?cfg.itens:[{}]).forEach(addItem);
  salvar();
}
function estadoAtual(){
  return { data:$('#data').value, uf:$('#uf').value, mun:$('#mun').value, aliq:[$('#aCbs').value,$('#aIbsUf').value,$('#aIbsMun').value],
    itens:[...document.querySelectorAll('#itens .item')].map(el=>{
      const q=s=>el.querySelector(s).value; const v={cst:q('.cst'), cClassTrib:q('.ccl'), baseCalculo:q('.base'), quantidade:q('.qtd'), unidade:q('.un')};
      v[el.dataset.tipo]=q('.cod');
      if (el.querySelector('.temIs').checked) v.is={cst:q('.isCst'), cClassTrib:q('.isCcl'), baseCalculo:q('.isBase'), adValorem:q('.isAliq'), adRem:q('.isAdRem'), impostoInformado:q('.isInf')};
      return v; }) };
}
let tmrSalvar;
function salvar(){ clearTimeout(tmrSalvar); tmrSalvar=setTimeout(()=>{ try{ localStorage.setItem('simuladorRTC', JSON.stringify(estadoAtual())); }catch{} },300); }

$('#btnAdd').onclick = ()=>{ addItem({}); salvar(); };
$('#btnCalcular').onclick = calcular;
$('#btnExemplo').onclick = ()=>aplicar(EXEMPLO);
$('#btnLimpar').onclick = ()=>aplicar({data:new Date().toISOString().slice(0,10), uf:$('#uf').value||'SP', mun:'', itens:[]});
$('#uf').onchange = ()=>{ carregarMunicipios(); salvar(); };
$('#mun').onchange = salvar;
['#aCbs','#aIbsUf','#aIbsMun'].forEach(s=>$(s).oninput=salvar);
$('#data').onchange = ()=>{ atualizarAliqUI(); carregarClassificacoes(); salvar(); };

(async function init(){
  try{
    await carregarUfs();
    let cfg = null; try{ cfg = JSON.parse(localStorage.getItem('simuladorRTC')); }catch{}
    await aplicar(cfg && cfg.itens ? cfg : EXEMPLO);
  }catch(e){
    $('#msgApi').innerHTML = `<div class="notice err">Não consegui falar com a calculadora (${esc(e.message)}). Abra esta página pelo INICIAR.bat, com a janela preta aberta.</div>`;
  }
})();
</script>
